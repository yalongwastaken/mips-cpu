# The LibreLane flow for the whole chip. `make syn` stops after synthesis;
# `make pnr` runs it through layout and sign-off.

DESIGN_NAME: mips_top
VERILOG_FILES: dir::../rtl/*.sv

# Yosys's own frontend cannot parse package types in port lists; Slang can
USE_SLANG: true

CLOCK_PORT: clk_i
# nanoseconds; synthesis, timing, and layout all take the clock target from here
CLOCK_PERIOD: 20

# The technology LEF's wire capacitance leaves out coupling between wires, so
# layout repair sized buffers for less load than extraction then measured.
# These are OpenROAD's calibrated values for this library, from
# OpenROAD-flow-scripts' sky130hd setRC.tcl.
LAYERS_RC:
  "*":
    li1: { res: 7.176e-02, cap: 1.499e-04 }
    met1: { res: 1.20565e-03, cap: 1.72375e-04 }
    met2: { res: 1.22132e-03, cap: 1.36233e-04 }
    met3: { res: 1.66281e-04, cap: 2.14962e-04 }
    met4: { res: 1.68093e-04, cap: 1.48128e-04 }
    met5: { res: 1.83558e-05, cap: 1.54087e-04 }
VIAS_R:
  "*":
    mcon: { res: 9.249146e-03 }
    via: { res: 4.5e-03 }
    via2: { res: 3.368786e-03 }
    via3: { res: 0.376635e-03 }
    via4: { res: 0.00580e-03 }
SIGNAL_WIRE_RC_LAYERS: [met1]
CLOCK_WIRE_RC_LAYERS: [met3]

# the PDK keeps these clock delay cells out of synthesis but not out of layout
# repair, which otherwise builds fanout trees from them that fail hold at the
# fast corners
EXTRA_EXCLUDED_CELLS:
  - sky130_fd_sc_hd__clkdlybuf4s*
# micrometers; OpenROAD's default is longer than the die, which leaves the
# clock pin's wire and the clock tree's upper buffers past their slew, load,
# and fanout limits
CTS_CLK_MAX_WIRE_LENGTH: 200
# repairs again once wires are routed, since the estimates repair uses during
# placement miss the routing's detours
RUN_POST_GRT_DESIGN_REPAIR: true
# post-route repair estimates with nominal wire RC, but the slow corner is
# extracted with maximum RC, which carries more capacitance on every net
GRT_DESIGN_REPAIR_MAX_SLEW_PCT: 30
# micrometers; repair otherwise leaves wires long enough to need antenna
# diodes, which then load the net past its fanout and slew limits
DESIGN_REPAIR_MAX_WIRE_LENGTH: 200
GRT_DESIGN_REPAIR_MAX_WIRE_LENGTH: expr::$DESIGN_REPAIR_MAX_WIRE_LENGTH

# LibreLane only warns on these by default; a violation at any corner fails
# the run
SETUP_VIOLATION_CORNERS: ["*"]
MAX_SLEW_VIOLATION_CORNERS: ["*"]
MAX_CAP_VIOLATION_CORNERS: ["*"]
