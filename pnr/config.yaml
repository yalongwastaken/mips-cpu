# The LibreLane flow for the whole chip. `make syn` stops after synthesis.

DESIGN_NAME: mips_top
VERILOG_FILES: dir::../rtl/*.sv

# Yosys's own frontend cannot parse package types in port lists; Slang can
USE_SLANG: true

CLOCK_PORT: clk_i
# nanoseconds; synthesis, timing, and layout all take the clock target from here
CLOCK_PERIOD: 20
